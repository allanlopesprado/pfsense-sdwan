name: Build pfSense package
on:
  push:
    branches: ['build/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native filter reload acknowledgement and reconciliation
        run: |
          python3 -B tests/steering_daemon.py php
          python3 -B tests/steering_startup.py php
      - name: Verify probes and native forwarding before packaging
        run: |
          php tests/behavior.php
          php tests/steering_preflight.php
          php tests/steering.php
      - uses: actions/checkout@v4
        with:
          repository: pfsense/pfsense
          ref: 9363ac5b8651a1c7a333180425ce7719070f95f9
          path: pfsense-core-fixture
          sparse-checkout: |
            src/usr/local/www/css
            src/usr/local/www/vendor/bootstrap
            src/usr/local/www/vendor/font-awesome
            src/usr/local/www/vendor/jquery
            src/usr/local/www/vendor/jquery-ui
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the widget in both native themes before packaging
        run: python3 -B tests/widget.py php --visual-core pfsense-core-fixture --screenshots "$RUNNER_TEMP/sdwan-dashboard"
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-dashboard-build
          path: ${{ runner.temp }}/sdwan-dashboard/
          if-no-files-found: error
      - uses: actions/checkout@v4
        with:
          repository: freebsd/pkg
          ref: 337d510a47f8716fb9c644262ada3db8d7f85e05 # 2.9.3
          path: freebsd-pkg
          persist-credentials: false
      - name: Build the Linux version of FreeBSD pkg
        env:
          CC: clang-18
          CXX: clang++-18
          CC_FOR_BUILD: clang-18
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -yq --no-install-recommends clang-18 fakeroot libarchive-dev \
            libssl-dev libsqlite3-dev libbsd-dev liblzma-dev liblua5.2-dev liblzo2-dev \
            libattr1-dev libacl1-dev zlib1g-dev libbz2-dev pkg-config m4
          mkdir "$RUNNER_TEMP/pkg-build"
          cd "$RUNNER_TEMP/pkg-build"
          "$GITHUB_WORKSPACE/freebsd-pkg/configure" --prefix="$RUNNER_TEMP/pkg-install" --with-libarchive.pc --with-openssl.pc
          make -j"$(nproc)"
          make install
      - name: Verify two identical package builds
        run: |
          set -eu
          builder="$RUNNER_TEMP/pkg-install/sbin/pkg"
          fakeroot python3 tools/build-lab-pkg.py --pkg "$builder" --output package-out
          fakeroot python3 tools/build-lab-pkg.py --pkg "$builder" --output "$RUNNER_TEMP/package-rebuild"
          for file in package-out/*; do
            cmp "$file" "$RUNNER_TEMP/package-rebuild/${file##*/}"
          done
          (cd package-out && sha256sum --check ./*.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: sdwan-package
          path: package-out/
          if-no-files-found: error
