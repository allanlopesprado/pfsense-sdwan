name: Access, VPN recovery, and traffic inspection labs
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vpn:
    name: ${{ matrix.protocol }} two-WAN recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        protocol: [openvpn, wireguard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install real VPN implementations and traffic capture
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y --no-install-recommends iproute2 openvpn wireguard-tools tcpdump dnsmasq-base bind9-dnsutils
          dpkg-query -W openvpn wireguard-tools dnsmasq-base bind9-dnsutils
      - name: Transfer data before outage, on backup link, and after return
        run: sudo python3 -B -u tests/lab/vpn-recovery.py "${{ matrix.protocol }}"
  access:
    name: ${{ matrix.protocol }} address and gateway recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        protocol: [dhcp, pppoe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install DHCP and PPPoE implementations
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping ethtool dnsmasq-base ppp pppoe busybox
          dpkg-query -W dnsmasq-base ppp pppoe busybox
      - name: Prepare PPPoE kernel driver
        if: matrix.protocol == 'pppoe'
        run: |
          sudo modprobe pppoe
          test -c /dev/ppp || sudo mknod /dev/ppp c 108 0
      - name: Renegotiate the link and compare old and current monitor metadata
        run: sudo python3 -B -u tests/lab/renew-dynamic-wan.py "${{ matrix.protocol }}"
  ipv6_pd:
    name: DHCPv6 Prefix Delegation and LAN renumbering
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install IPv6 access components
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping isc-dhcp-client kea-dhcp6-server radvd
          dpkg-query -W isc-dhcp-client kea-dhcp6-server radvd
      - name: Delegate, advertise, withdraw and replace an IPv6 prefix
        run: sudo python3 -B -u tests/lab/ipv6-pd.py
  inspection:
    name: Suricata inspection across two WANs
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Suricata and Linux inspection dependencies
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo systemctl mask --runtime suricata.service
          sudo apt-get install -y --no-install-recommends iproute2 iputils-ping nftables suricata
          dpkg-query -W suricata
          sudo modprobe nfnetlink_queue
      - name: Verify alert, drop, and failover behavior
        run: sudo python3 -B -u tests/lab/inspection.py
  netmap:
    name: FreeBSD Suricata netmap inspection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure the Ubuntu dependency mirror
        run: bash .github/scripts/ubuntu-archive.sh
      - name: Verify native netmap packet delivery and blocking
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          usesh: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap
            pkg install -y python3 suricata
            pkg info suricata
          run: sh tests/lab/freebsd-netmap.sh
