name: IKEv2 tunnel checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strongswan:
    name: Ubuntu IKEv2 negotiation and rekey (${{ matrix.paths }} links)
    strategy:
      fail-fast: false
      matrix:
        paths: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ubuntu networking and strongSwan packages
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y --no-install-recommends \
            iproute2 iputils-ping nftables tcpdump strongswan-charon \
            strongswan-swanctl libstrongswan-standard-plugins
          uname -r
          dpkg-query -W strongswan-charon strongswan-swanctl nftables
      - name: Negotiate, rekey, withdraw and restore tunnel paths
        run: sudo python3 -B -u tests/lab/ikev2/run.py --paths ${{ matrix.paths }}
