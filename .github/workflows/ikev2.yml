name: IKEv2 tunnel checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strongswan:
    name: Ubuntu IKEv2 ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {paths: 1, scenario: "negotiation and rekey (1 link)"}
          - {paths: 2, scenario: "negotiation and rekey (2 links)"}
          - {paths: 3, scenario: "negotiation and rekey (3 links)"}
          - {paths: 2, scenario: "shared selectors and return paths", options: "--shared-selectors"}
          - {paths: 1, scenario: "VIP takeover and new SAs", options: "--vip-takeover"}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ubuntu networking and strongSwan packages
        run: |
          bash .github/scripts/ubuntu-archive.sh
          sudo apt-get install -y --no-install-recommends \
            iproute2 iputils-ping nftables tcpdump strongswan-charon \
            strongswan-swanctl libstrongswan-standard-plugins
          uname -r
          dpkg-query -W strongswan-charon strongswan-swanctl nftables
      - name: Exercise negotiated SAs and verify tunnel paths
        run: sudo python3 -B -u tests/lab/ikev2/run.py --paths ${{ matrix.paths }} ${{ matrix.options }}
