name: Package checks
on:
  push:
    branches-ignore: ['build/**']
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      appliance:
        description: Also run the two CE appliance acceptance jobs
        type: boolean
        default: false
      extended:
        description: Run the deeper two-version CE scenario matrix
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  divergence-audit:
    name: divergence-audit (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run divergence checks with recorded seeds
        env:
          AUDIT_SHARD: ${{ matrix.shard }}
          AUDIT_ROUNDS: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '8' || '4' }}
        run: |
          start_seed=$((GITHUB_RUN_ID * 64 + AUDIT_SHARD * 16))
          python3 -B tests/audit/campaign.py --start-seed "$start_seed" --rounds "$AUDIT_ROUNDS" \
            --output "$RUNNER_TEMP/sdwan-audit"
      - name: Add results to the workflow summary
        if: always()
        run: |
          report="$RUNNER_TEMP/sdwan-audit"
          if [ -f "$report/campaign.md" ]; then
            cat "$report/campaign.md" >> "$GITHUB_STEP_SUMMARY"
            known=$(jq -r .counts.known "$report/campaign.json")
            if [ "$known" -gt 0 ]; then
              echo "::warning title=Known SD-WAN discrepancies::$known still reproduced. See the run summary."
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sdwan-divergence-audit-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdwan-audit/
          if-no-files-found: error
          retention-days: 30
  ikev2:
    uses: ./.github/workflows/ikev2.yml
  homologation:
    uses: ./.github/workflows/homologation.yml
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install source lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils shellcheck
      - name: Check package metadata, source syntax and offline behavior
        env:
          REQUIRE_NATIVE_SOCKET_TEST: "1"
          VERIFY_RELEASE_PAYLOAD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ') }}
        run: |
          if [ "$VERIFY_RELEASE_PAYLOAD" = 'true' ]; then
            sh tests/run.sh --archive-parity
          else
            sh tests/run.sh
          fi
      - name: Verify the native source checkout destination
        run: test ! -e pfsense-core-fixture && test ! -L pfsense-core-fixture
      - name: Check out native pfSense XML, privilege and form implementations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pfsense/pfsense
          ref: 9363ac5b8651a1c7a333180425ce7719070f95f9
          path: pfsense-core-fixture
          sparse-checkout: |
            src/etc/inc
            src/usr/local/www/css
            src/usr/local/www/js/pfSense.js
            src/usr/local/www/js/pfSenseHelpers.js
            src/usr/local/www/head.inc
            src/usr/local/www/vendor/font-awesome
            src/usr/local/www/vendor/bootstrap
            src/usr/local/www/vendor/jquery
            src/usr/local/www/vendor/jquery-ui
            src/usr/local/www/classes
            src/usr/local/www/csrf
            src/usr/local/www/guiconfig.inc
            src/usr/local/www/shortcuts.inc
            src/usr/local/www/status_logs.php
            src/usr/local/www/status_logs_common.inc
            src/usr/local/www/system_gateway_groups.php
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify the build overlay against the pinned pfSense source
        run: |
          python3 tools/prepare-core.py --source pfsense-core-fixture --out "$RUNNER_TEMP/sdwan-core"
          for profile in --ce-291-lab --ce-292-lab; do
            if python3 tools/prepare-core.py "$profile" --source pfsense-core-fixture --out "$RUNNER_TEMP/wrong-core"; then
              echo "$profile must reject the public development fingerprint." >&2
              exit 1
            fi
            test ! -e "$RUNNER_TEMP/wrong-core"
          done
      - name: Verify native XML, privileges and WebGUI form requests
        run: |
          php tests/pfsense_core.php "$GITHUB_WORKSPACE/pfsense-core-fixture"
          php tests/lab/native-group-removal.php "$GITHUB_WORKSPACE/pfsense-core-fixture"
          python3 tests/webgui.py --classes "$GITHUB_WORKSPACE/pfsense-core-fixture/src/usr/local/www/classes" --screenshots-dir "$RUNNER_TEMP/sdwan-pages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdwan-pages
          path: ${{ runner.temp }}/sdwan-pages/
          if-no-files-found: error
      - name: Render native dashboard in the light and dark themes
        run: python3 -B tests/widget.py php --visual-core "$GITHUB_WORKSPACE/pfsense-core-fixture" --screenshots "$RUNNER_TEMP/sdwan-dashboard"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdwan-dashboard
          path: ${{ runner.temp }}/sdwan-dashboard/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-syslog
          path: pfsense-core-fixture/src/etc/inc/syslog.inc
          if-no-files-found: error
      - name: Generate native PF rules from the daemon's gateway samples
        run: python3 -B tests/core_adapter.py --core pfsense-core-fixture --emit-dir "$RUNNER_TEMP/sdwan-rules"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-filter-rules
          path: ${{ runner.temp }}/sdwan-rules/*.pf
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-filter-source
          path: |
            pfsense-core-fixture/src/etc/inc/filter.inc
            pfsense-core-fixture/src/etc/inc/globals.inc
            pfsense-core-fixture/src/etc/inc/util.inc
          if-no-files-found: error
  freebsd:
    needs: offline
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Retrieve lab fixtures from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n native-filter-rules -D lab-rendered
          gh run download "$GITHUB_RUN_ID" -n native-syslog -D lab-syslog
          gh run download "$GITHUB_RUN_ID" -n native-filter-source -D lab-core/src/etc/inc
      - name: Configure the Ubuntu dependency mirror
        run: bash .github/scripts/ubuntu-archive.sh
      - name: Test the pinned installer and native forwarding rules in FreeBSD
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          usesh: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap
            pkg install -y php84 php84-filter php84-mbstring php84-ctype python3 dpinger git
            php -n -v
          run: |
            set -eu
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$PWD"
            if sh tools/update-install-line.sh; then
              echo 'The README generator accepted the FreeBSD 15 runner ABI' >&2
              exit 1
            fi
            # Exercise the target ABI with real pkg, sha256 and Git on this FreeBSD builder.
            ABI=FreeBSD:16:amd64 sh tools/update-install-line.sh
            git diff --exit-code -- README.md
            candidate=$(mktemp -d)
            trap 'rm -rf "$candidate"' EXIT
            if ! python3 tools/build-lab-pkg.py --output "$candidate/artifacts" > "$candidate/build.log" 2>&1; then
              tail -20 "$candidate/build.log"
              exit 1
            fi
            mkdir -p "$candidate/root/var/db/pkg" "$candidate/root/var/cache/pkg"
            /usr/local/sbin/pkg-static -r "$candidate/root" -o ABI=FreeBSD:16:amd64 -o OSVERSION=1600018 add -I "$candidate"/artifacts/*.pkg
            /usr/local/sbin/pkg-static -r "$candidate/root" -o ABI=FreeBSD:16:amd64 -o OSVERSION=1600018 check -s pfSense-pkg-SDWAN
            test "$(stat -f '%u:%g %Lp' "$candidate/root/etc/inc/priv/sdwan.priv.inc")" = '0:0 644'
            test "$(stat -f '%u:%g %Lp' "$candidate/root/usr/local/etc/rc.d/sdwand.sh")" = '0:0 755'
            python3 -B tests/steering_daemon.py php --load-filter-extension
            sh tests/freebsd-install.sh
            sh tests/lab/freebsd-system-log.sh "$PWD/lab-syslog/syslog.inc" --source-only
            sh tests/lab/freebsd-carp.sh
            SDWAN_REAL_DPINGER=1 SDWAN_RENDERED_RULES="$PWD/lab-rendered" sh tests/lab/freebsd-dataplane.sh
            SDWAN_ERP_ONLY=1 SDWAN_NATIVE_CORE="$PWD/lab-core" sh tests/lab/freebsd-dataplane.sh
  release-appliance:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')) || (github.event_name == 'workflow_dispatch' && inputs.appliance && !inputs.extended)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        version: ['2.9.1', '2.9.2']
    uses: ./.github/workflows/ce291-appliance.yml
    with:
      ce_version: ${{ matrix.version }}
      artifact_suffix: -${{ matrix.version }}
  extended-package:
    if: github.event_name == 'workflow_dispatch' && inputs.extended
    uses: ./.github/workflows/build-package.yml
    with:
      artifact_suffix: -extended
  extended-appliance:
    needs: extended-package
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        version: ['2.9.1', '2.9.2']
        scenario: [acceptance, shared-target, activation-guard, inspection]
        include:
          - version: '2.9.1'
            scenario: recovery
    uses: ./.github/workflows/ce291-appliance.yml
    with:
      ce_version: ${{ matrix.version }}
      scenario: ${{ matrix.scenario }}
      artifact_suffix: -extended
      reuse_package: true
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
    needs: [divergence-audit, offline, freebsd, ikev2, homologation, release-appliance]
    runs-on: ubuntu-24.04
    concurrency:
      group: sdwan-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Retrieve previews and both qualified packages from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n sdwan-dashboard -D release-previews
          gh run download "$GITHUB_RUN_ID" -n sdwan-pages -D release-pages
          gh run download "$GITHUB_RUN_ID" -n sdwan-package-2.9.1 -D release-ce291
          gh run download "$GITHUB_RUN_ID" -n sdwan-package-2.9.2 -D release-ce292
      - name: Publish verified laboratory distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(jq -er '.version | select(test("^[0-9]+[.][0-9]+[.][0-9]+$"))' dist/release.json)
          tag="v$version"
          package="pfSense-pkg-SDWAN-$version.pkg"
          case "$(git log -1 --format=%s)" in
            "Release $version"|"Release $version "*) ;;
            *) echo "The release commit must identify version $version." >&2; exit 1 ;;
          esac
          (cd dist && sha256sum --check "$package.sha256")
          cmp "dist/$package" "release-ce291/$package"
          cmp "dist/$package" "release-ce292/$package"
          published_index=$(gh api "repos/$GITHUB_REPOSITORY/contents/dist/release.json?ref=main" --jq .content)
          current_index=$(printf '%s' "$published_index" | base64 --decode | jq -cS .)
          if [ "$current_index" != "$(jq -cS . dist/release.json)" ]; then
            echo "A newer release index reached main while these checks were running." >&2
            exit 1
          fi
          if release=$(gh release view "$tag" --json isDraft,isPrerelease 2>/dev/null); then
            printf '%s' "$release" | jq -e '(.isDraft or .isPrerelease) | not' >/dev/null
            tagged_blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/dist/$package?ref=$tag" --jq .sha)
            test "$tagged_blob" = "$(git rev-parse "HEAD:dist/$package")"
            dir=$(mktemp -d)
            trap 'rm -f "$dir/$package" "$dir/$package.sha256"; rmdir "$dir"' EXIT
            gh release download "$tag" --dir "$dir" --pattern "$package" --pattern "$package.sha256"
            cmp "$dir/$package" "dist/$package"
            cmp "$dir/$package.sha256" "dist/$package.sha256"
            exit 0
          fi
          if tag_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null); then
            test "$tag_revision" = "$GITHUB_SHA"
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/sdwan-published-tags"
          python3 tools/render_release_notes.py --repository "$GITHUB_REPOSITORY" \
            --published-tags "$RUNNER_TEMP/sdwan-published-tags" --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/sdwan-release-notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --latest \
            --title "SD-WAN $version for pfSense CE (lab release)" \
            --notes-file "$RUNNER_TEMP/sdwan-release-notes.md" "dist/$package" "dist/$package.sha256" \
            release-previews/widget-*.png release-pages/*.png
