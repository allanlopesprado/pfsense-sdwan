name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check port, PHP syntax and offline behavior
        env:
          REQUIRE_NATIVE_SOCKET_TEST: "1"
        run: sh tests/run.sh
