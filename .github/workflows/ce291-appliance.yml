name: CE two-WAN appliance
on:
  push:
    branches: ['lab/ce291-candidate', 'fix/multiwan-reconciliation']
    paths:
      - '.github/workflows/ce291-appliance.yml'
      - '.github/workflows/build-package.yml'
      - '.github/scripts/ubuntu-archive.sh'
      - 'tests/lab/ce291-*'
      - 'core/**'
      - 'files/**'
      - 'Makefile'
      - 'pkg-descr'
      - 'pkg-plist'
      - 'tools/prepare-core.py'
      - 'tools/build-lab-pkg.py'
      - 'tools/previous-dist-package.sh'
      - 'dist/pfSense-pkg-SDWAN-*.pkg*'
  workflow_dispatch:
    inputs:
      ce_version:
        description: pfSense CE release for the isolated appliance
        type: choice
        default: '2.9.1'
        options: ['2.9.1', '2.9.2']
      scenario:
        description: Appliance acceptance, diagnostics, recovery, or package security inventory
        type: choice
        default: acceptance
        options: [acceptance, paths, benchmark, recovery, shared-target, inspection, activation-guard, security, source-scan]
      pairs:
        description: Number of native versus SD-WAN pairs for the benchmark
        type: number
        default: 2
      soak_hours:
        description: Optional continuous observation after benchmarking, for up to 3 hours
        type: number
        default: 0
      soak_mode:
        description: Forwarding mode for the continuous phase of the benchmark
        type: choice
        default: sdwan
        options: [sdwan, native]
      fault_interval_seconds:
        description: Healthy interval before each fault during continuous observation
        type: number
        default: 1800
      recovery_hold_seconds:
        description: SD-WAN preferred path qualification hold for this benchmark
        type: number
        default: 30
      security_profile:
        description: Additional signed packages to include in the security inventory
        type: choice
        default: base
        options: [base, suricata]
      source_scan_certificate:
        description: Public PEM certificate for the private source scan result
        type: string
        required: false
      source_scan_ref:
        description: Full commit SHA of the source to scan
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ce-native-${{ inputs.ce_version || '2.9.1' }}-${{ inputs.scenario || 'acceptance' }}-${{ inputs.soak_mode || 'sdwan' }}-${{ inputs.security_profile || 'base' }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    if: inputs.scenario != 'source-scan'
    uses: ./.github/workflows/build-package.yml
  source-scan:
    if: inputs.scenario == 'source-scan'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Validate the scan commit
        env:
          AUDIT_REF: ${{ inputs.source_scan_ref }}
        run: '[[ "$AUDIT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_scan_ref }}
      - name: Scan source and encrypt the detailed report
        env:
          AUDIT_PUBLIC_CERT: ${{ inputs.source_scan_certificate }}
          SEMGREP_SEND_METRICS: 'off'
        run: |
          set -euo pipefail
          umask 077
          audit_dir=$(mktemp -d "$RUNNER_TEMP/sdwan-sast.XXXXXX")
          printf '%s\n' "$AUDIT_PUBLIC_CERT" > "$audit_dir/recipient.pem"
          openssl x509 -in "$audit_dir/recipient.pem" -noout > /dev/null
          python3 -m venv "$audit_dir/venv"
          "$audit_dir/venv/bin/python" -m pip --disable-pip-version-check --quiet install 'semgrep==1.186.0'
          mkdir "$audit_dir/php" "$audit_dir/shell"
          git ls-files -z 'files/*.php' 'files/*.inc' 'core/*.inc' 'tests/*.php' 'tests/*.inc' | AUDIT_ROOT="$audit_dir/php" python3 -c '
          import os, shutil, sys
          from pathlib import Path
          root = Path(os.environ["AUDIT_ROOT"])
          for name in sys.stdin.buffer.read().decode().split("\0"):
              if not name:
                  continue
              source = Path(name)
              target = root / (name + ".php" if source.suffix == ".inc" else name)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          '
          git ls-files -z '*.sh' 'files/pkg-*.in' | AUDIT_ROOT="$audit_dir/shell" python3 -c '
          import os, shutil, sys
          from pathlib import Path
          root = Path(os.environ["AUDIT_ROOT"])
          for name in filter(None, sys.stdin.buffer.read().decode().split("\0")):
              source = Path(name)
              target = root / (name + ".sh" if source.suffix == ".in" else name)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          '
          scan() {
            rulepack=$1
            report=$2
            shift 2
            "$audit_dir/venv/bin/semgrep" scan --metrics off --disable-version-check --no-git-ignore \
              --config "$rulepack" --json --quiet --output "$audit_dir/$report.json" -- "$@"
          }
          (cd "$audit_dir/php"; scan p/php php .)
          scan p/github-actions workflows .github/workflows
          scan p/python python tools tests
          (cd "$audit_dir/shell"; scan p/bash shell .)
          jq -s --arg revision "$(git rev-parse HEAD)" '{version: .[0].version, revision: $revision,
            paths: {scanned: ([.[].paths.scanned[]] | unique)},
            results: [.[].results[]], errors: [.[].errors[]]}' \
            "$audit_dir/php.json" "$audit_dir/workflows.json" "$audit_dir/python.json" "$audit_dir/shell.json" > "$audit_dir/result.json"
          jq -e '.paths.scanned | length > 0' "$audit_dir/result.json" > /dev/null
          openssl cms -encrypt -binary -aes-256-gcm -in "$audit_dir/result.json" \
            -outform DER -out "$RUNNER_TEMP/sdwan-source-scan.cms" "$audit_dir/recipient.pem"
          jq -c '{scanner: .version, revision: .revision, scanned: (.paths.scanned | length), matches: (.results | length), errors: (.errors | length)}' \
            "$audit_dir/result.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdwan-source-scan-encrypted
          path: ${{ runner.temp }}/sdwan-source-scan.cms
          if-no-files-found: error
          retention-days: 7
  appliance:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.scenario == 'benchmark' && 300 || 45 }}
    env:
      CE_VERSION: ${{ inputs.ce_version == '2.9.2' && '2.9.2' || '2.9.1' }}
      CE_LAB: ${{ inputs.ce_version == '2.9.2' && 'ce292' || 'ce291' }}
      CE_SCENARIO: ${{ inputs.scenario || 'acceptance' }}
      CE_PAIRS: ${{ inputs.pairs }}
      CE_SOAK_HOURS: ${{ inputs.soak_hours }}
      CE_SOAK_MODE: ${{ inputs.soak_mode || 'sdwan' }}
      CE_FAULT_INTERVAL: ${{ inputs.fault_interval_seconds }}
      CE_RECOVERY_HOLD: ${{ inputs.recovery_hold_seconds }}
      CE_SECURITY_PROFILE: ${{ inputs.security_profile || 'base' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Ubuntu package mirror
        run: bash .github/scripts/ubuntu-archive.sh
      - name: Validate scenario inputs
        run: |
          set -eu
          if [ "$CE_SCENARIO" = recovery ]; then
            test "$CE_VERSION" = 2.9.1
          elif [ "$CE_SCENARIO" = benchmark ]; then
            python3 -c 'import os; pairs = int(os.environ["CE_PAIRS"]); soak = float(os.environ["CE_SOAK_HOURS"]); assert 0 <= pairs <= 5 and 0 <= soak <= 3 and (pairs or soak >= 6/3600); assert 6 <= int(os.environ["CE_FAULT_INTERVAL"]) <= 86400; assert 0 <= int(os.environ["CE_RECOVERY_HOLD"]) <= 300'
          fi
      - name: Recover the disposable disk for this pinned input
        if: env.CE_SCENARIO != 'security'
        id: disk
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CE_LAB }}.raw.gz
          key: ${{ env.CE_LAB }}-candidate-disk-v6-${{ (env.CE_SCENARIO == 'recovery' || env.CE_SCENARIO == 'inspection') && env.CE_SCENARIO || 'base' }}-${{ hashFiles('.github/workflows/ce291-appliance.yml', '.github/workflows/build-package.yml', 'tests/lab/ce291-disk.sh', 'tests/lab/ce291-guest.php', 'tests/lab/ce291-source.py', 'core/**', 'tools/prepare-core.py', 'tools/build-lab-pkg.py', 'tools/previous-dist-package.sh', 'tools/verify-appliance.sh', 'files/**', 'Makefile', 'pkg-descr', 'pkg-plist', 'dist/pfSense-pkg-SDWAN-*.pkg*') }}
      - uses: actions/download-artifact@v4
        if: steps.disk.outputs.cache-hit != 'true'
        with:
          name: sdwan-package
          path: ce-candidate-package
      - name: Prepare the audited CE adapter
        if: env.CE_SCENARIO != 'security' && steps.disk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          series=${CE_VERSION//./_}
          archive="$RUNNER_TEMP/pfSense-system-$CE_VERSION.pkg"
          curl --fail --silent --show-error --retry 2 --max-time 150 --proto '=https' \
            --output "$archive" \
            "https://pkg01-atx.netgate.com/pfSense_v${series}_amd64-pfSense_v${series}/All/pfSense-system-${CE_VERSION}.pkg"
          python3 tests/lab/ce291-source.py "$archive" lab-source --ce-version "$CE_VERSION"
          sha256sum "$archive" lab-source/src/etc/inc/filter.inc
          # Both verified system packages ship the same audited generator.
          python3 tools/prepare-core.py --ce-292-lab --source lab-source --out lab-overlay
      - name: Prepare and verify signed Netgate packages
        if: steps.disk.outputs.cache-hit != 'true'
        uses: vmactions/freebsd-vm@4441bea20b31bfa77329a5af583199362489567e # v1.4.9
        with:
          release: "15.1"
          usesh: true
          prepare: |
            env ASSUME_ALWAYS_YES=yes pkg bootstrap
          run: |
            set -eu
            sh tests/lab/ce291-disk.sh "$PWD" '${{ env.CE_VERSION }}' '${{ env.CE_SCENARIO }}' '${{ env.CE_SECURITY_PROFILE }}'
      - name: Cache the unbooted disk
        if: env.CE_SCENARIO != 'security' && steps.disk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CE_LAB }}.raw.gz
          key: ${{ steps.disk.outputs.cache-primary-key }}
      - name: Install QEMU for the isolated appliance
        if: env.CE_SCENARIO != 'security'
        run: sudo apt-get install -y --no-install-recommends qemu-system-x86 nftables python3-pexpect dnsmasq-base openssl tcpdump
      - name: Run native installation, PF reload, reboot and rollback
        if: env.CE_SCENARIO != 'security'
        run: |
          set -euo pipefail
          gunzip "$CE_LAB.raw.gz"
          printf 'CANDIDATE_GIT_SHA=%s\nTARGET_CE=%s\n' "$GITHUB_SHA" "$CE_VERSION" | tee "$CE_LAB-result.log"
          case "$CE_SCENARIO" in
            acceptance)
              sudo /usr/bin/python3 tests/lab/ce291-appliance.py "$CE_LAB.raw" "$CE_VERSION" | tee -a "$CE_LAB-result.log"
              ;;
            benchmark)
              sudo /usr/bin/python3 tests/lab/ce-ab-benchmark.py "$CE_LAB.raw" "$CE_VERSION" \
                --pairs "$CE_PAIRS" --soak-hours "$CE_SOAK_HOURS" --fault-interval-seconds "$CE_FAULT_INTERVAL" \
                --recovery-hold-seconds "$CE_RECOVERY_HOLD" --soak-mode "$CE_SOAK_MODE" --capture-erp \
                --output ce-ab-results | tee -a "$CE_LAB-result.log"
              ;;
            shared-target)
              sudo /usr/bin/python3 tests/lab/ce-shared-target.py "$CE_LAB.raw" "$CE_VERSION" | tee -a "$CE_LAB-result.log"
              ;;
            activation-guard)
              sudo /usr/bin/python3 tests/lab/ce-shared-target.py "$CE_LAB.raw" "$CE_VERSION" --activation-guard | tee -a "$CE_LAB-result.log"
              ;;
            inspection)
              sudo /usr/bin/python3 tests/lab/ce-sdwan-inspection.py "$CE_LAB.raw" "$CE_VERSION" | tee -a "$CE_LAB-result.log"
              ;;
            paths|recovery)
              sudo /usr/bin/python3 tests/lab/ce291-appliance.py "$CE_LAB.raw" "$CE_VERSION" "$CE_SCENARIO" | tee -a "$CE_LAB-result.log"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.CE_LAB }}-${{ env.CE_SCENARIO }}-result
          path: |
            ${{ env.CE_LAB }}-result.log
            ${{ env.CE_LAB }}-console.log
            ${{ env.CE_LAB }}-security/
            ce-ab-results/
      - name: Check the VuXML report
        if: env.CE_SCENARIO == 'security'
        run: |
          set -euo pipefail
          report="$CE_LAB-security"
          test "$(wc -l < "$report/packages.txt")" -gt 1
          matches=$(jq -er '.pkg_count | select(type == "number" and . >= 0)' "$report/vuxml.json")
          printf 'CE %s · %s packages audited · %s VuXML package matches\n' \
            "$CE_VERSION" "$(wc -l < "$report/packages.txt")" "$matches" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$matches" -ne 0 ]; then
            jq -r '.packages | keys[]' "$report/vuxml.json"
            exit 1
          fi
          grep -qx 'PKG_AUDIT_EXIT=0' "$report/metadata.txt"
